<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Matrix</title>


  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── CLEAN MINIMALISM TOKENS ── */
:root, [data-theme="light"], [data-theme="white"] {
  --canvas: #F9FAFB;
  --canvas2: #F3F4F6;
  --canvas3: #EEF2FF;
  --card: #FFFFFF;
  --ink: #111827;
  --ink2: #374151;
  --muted: #6B7280;
  --line: #000000;
  --red: #DC2626;
  --red2: #EF4444;
  --green: #059669;
  --green2: #10B981;
  --blue: #2563EB;
  --border-w: 2px;
  --shadow-c: #000000;
  --shadow: 4px 4px 0 0 var(--shadow-c);
  --shadow-lg: 6px 6px 0 0 var(--shadow-c);
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'Segoe UI Mono', Consolas, 'Liberation Mono', Menlo, monospace;

  /* legacy aliases (old inline styles still resolve) */
  --bg: var(--canvas);
  --bg2: var(--canvas2);
  --bg3: var(--canvas3);
  --cream: var(--canvas);
  --cream2: var(--canvas2);
  --cream3: var(--canvas3);
  --nav-bg: var(--card);
  --orange: var(--red);
  --orange-deep: var(--red2);
  --rule: #C7CDD4;
  --accent: var(--blue);
  --accent-deep: var(--blue);
  --accent2: var(--green2);
  --accent-text: var(--red);
  --accent2-text: var(--green);
  --danger: var(--red);
  --btn-ink: var(--card);
  --serif: var(--sans);
  --display: var(--sans);
  --font: var(--sans);
  --glow: none;
}

[data-theme="dark"], [data-theme="violet"] {
  --canvas: #0E1420;
  --canvas2: #161E2C;
  --canvas3: #1D2736;
  --card: #121A26;
  --ink: #EDF2F9;
  --ink2: #C3CFDF;
  --muted: #8398AF;
  --line: #93A5BA;
  --red: #FF5252;
  --red2: #FF7A70;
  --green: #22C88A;
  --green2: #34D399;
  --blue: #60A5FA;
  --shadow-c: #000000;

  --bg: var(--canvas);
  --bg2: var(--canvas2);
  --bg3: var(--canvas3);
  --cream: var(--canvas);
  --cream2: var(--canvas2);
  --cream3: var(--canvas3);
  --nav-bg: var(--canvas);
  --rule: #2E3B4F;
  --accent: var(--blue);
  --accent-deep: var(--blue);
  --accent2: var(--green2);
  --accent-text: var(--red2);
  --accent2-text: var(--green2);
  --danger: var(--red2);
  --btn-ink: var(--canvas);
  --glow: none;
}

html {
  background-color: var(--canvas);
  transition: background-color 0.3s ease;
}
body {
  background: transparent;
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
  transition: color 0.3s ease;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

}
/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--canvas);
  border-bottom: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2.5rem; height: 56px;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.nav-brand {
  font-family: var(--mono); font-size: 0.9rem; font-weight: 700;
  color: var(--ink); text-decoration: none; letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
  transition: color 0.15s;
}
.nav-brand:hover { color: var(--red); }
.nav-brand span { color: var(--red); }

.nav-right { display: flex; align-items: center; gap: 0.6rem; }
.nav-links { display: flex; align-items: center; gap: 0.4rem; list-style: none; }
.nav-links a {
  font-family: var(--mono); font-size: 0.62rem; font-weight: 700; color: var(--ink);
  text-decoration: none; padding: 0.32rem 0.65rem;
  border: 2px solid var(--line); background: var(--card);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: border-color 0.15s, background 0.12s, color 0.12s, transform 0.12s, box-shadow 0.12s;
  display: flex; align-items: center; gap: 0.35rem;
  text-transform: uppercase; letter-spacing: 0.03em;
}
.nav-links a:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: #fff; }
.nav-links a svg { flex-shrink: 0; }
.nav-links li:nth-child(1) a:hover { background: var(--red); }
.nav-links li:nth-child(2) a:hover { background: var(--blue); }
.nav-links li:nth-child(3) a:hover { background: var(--green); }
.nav-links li:nth-child(4) a:hover { background: var(--green2); }
.nav-links li:nth-child(5) a:hover { background: var(--red2); }

/* ── THEME TOGGLE ── */
.theme-toggle {
  position: relative; width: 52px; height: 26px;
  background: var(--card); border: 2px solid var(--line);
  border-radius: 0; cursor: pointer;
  flex-shrink: 0; transition: background 0.3s, border-color 0.3s;
  overflow: hidden;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
}
.theme-toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--red);
  border: 2px solid var(--line);
  transition: transform 0.3s cubic-bezier(.65,0,.35,1);
  display: flex; align-items: center; justify-content: center;
}
[data-theme="dark"] .theme-toggle-thumb, [data-theme="violet"] .theme-toggle-thumb { transform: translateX(25px); }
.theme-toggle .icon-sun, .theme-toggle .icon-moon {
  position: absolute; top: 50%; transform: translateY(-50%);
  transition: opacity 0.25s;
}
.theme-toggle .icon-sun { left: 6px; }
.theme-toggle .icon-moon { right: 6px; }
[data-theme="light"] .icon-moon, [data-theme="white"] .icon-moon { opacity: 0.4; }
[data-theme="dark"] .icon-sun, [data-theme="violet"] .icon-sun { opacity: 0.4; }

/* ── CURSOR BLINK (terminal prompts) ── */
.cursor {
  display: inline-block;
  width: 7px; height: 1em;
  background: var(--red);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: cursor-blink 1s step-end infinite;
}
@keyframes cursor-blink { 50% { opacity: 0; } }

/* ── FLOATING SUPPORT BUTTON ── */
.support-fab {
  position: fixed; top: 72px; right: 24px; z-index: 60;
  display: inline-flex; align-items: center; gap: 0.42rem;
  background: var(--red); color: #fff;
  font-family: var(--mono); font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  border: 2px solid var(--line); border-radius: 0; padding: 0.58rem 1rem;
  cursor: pointer;
  box-shadow: 4px 4px 0 0 var(--shadow-c);
  transform: translateY(0);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
  width: fit-content;
}
.support-fab:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 0 var(--shadow-c); }
.support-fab:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 0 var(--shadow-c); }

/* ── SHARE TOAST ── */
.share-toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--canvas);
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em;
  font-weight: 700; padding: 0.6rem 1.2rem;
  border: 2px solid var(--line);
  pointer-events: none; opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 200;
}
.share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SECTION LABEL ── */
.section-label {
  font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--ink); margin-bottom: 2rem;
  display: flex; align-items: center; gap: 1rem; font-weight: 700;
}
.section-label::after { content: ''; flex: 1; height: 2px; background: var(--line); }

/* ── BUTTONS (generic) ── */
.promo-cta, .cli-cta, .book-read-btn, .support-continue,
.upi-app-btn, .load-more-btn, .blog-view-all, .download-btn, .btn-add, .btn-ghost, .install-copy {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--ink); color: var(--canvas);
  font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  padding: 0.7rem 1.3rem 0.65rem;
  text-decoration: none; cursor: pointer; border: 2px solid var(--line);
  border-radius: 0; box-shadow: 4px 4px 0 0 var(--shadow-c);
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, background 0.15s, color 0.15s;
  width: -moz-fit-content; width: fit-content;
}
.promo-cta:hover, .cli-cta:hover, .book-read-btn:hover, .support-continue:hover,
.upi-app-btn:hover, .load-more-btn:hover, .blog-view-all:hover, .btn-add:hover {
  transform: translate(-2px,-2px); box-shadow: 6px 6px 0 0 var(--shadow-c);
  background: var(--red); color: #fff;
}
.promo-cta:active, .cli-cta:active, .book-read-btn:active, .support-continue:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 0 var(--shadow-c); }

/* ── FOOTER ── */
footer { border-top: 2px solid var(--line); background: var(--canvas); transition: background 0.3s; }
.footer-inner {
  max-width: 1200px; margin: 0 auto; padding: 1.6rem 3rem 1.2rem;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem;
}
.footer-brand {
  font-family: var(--mono); font-size: 0.85rem; font-weight: 700;
  color: var(--ink); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em;
}
.footer-brand span { color: var(--red); }
.footer-tagline { font-size: 0.66rem; color: var(--muted); font-weight: 400; line-height: 1.5; }
.footer-links { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; }
.footer-links-label {
  font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); font-weight: 700;
}
.footer-links a {
  font-family: var(--mono); font-size: 0.62rem; color: var(--ink); font-weight: 700;
  text-decoration: none; letter-spacing: 0.05em;
  border: 2px solid var(--line); border-radius: 0;
  padding: 0.22rem 0.65rem; background: var(--card);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.12s;
}
.footer-links a:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: var(--red); }
.footer-bottom {
  max-width: 1200px; margin: 0 auto; padding: 0.9rem 3rem 1.2rem;
  border-top: 2px dashed var(--rule);
  display: flex; align-items: center; gap: 1.1rem;
}
.footer-bottom-logo { height: 44px; width: auto; flex-shrink: 0; border-radius: 0; border: 2px solid var(--line); }
.footer-bottom-text { font-size: 0.6rem; color: var(--muted); font-family: var(--mono); line-height: 1.6; font-weight: 700; }
.footer-managed { color: var(--ink2); margin-bottom: 0.2rem; }
.footer-managed a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--rule); }
.footer-managed a:hover { text-decoration-color: var(--red); }
.footer-top {
  margin-left: auto;
  font-family: var(--mono); font-size: 0.58rem; color: var(--ink); font-weight: 700;
  text-decoration: none; letter-spacing: 0.08em;
  border: 2px solid var(--line); border-radius: 0; padding: 0.25rem 0.65rem;
  white-space: nowrap; background: var(--card);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.12s;
}
.footer-top:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: var(--red); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: center; justify-content: center; padding: 1.5rem; }
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border: 2px solid var(--line);
  max-width: 560px; width: 100%; padding: 2.2rem;
  position: relative; max-height: 88vh; overflow-y: auto;
  border-radius: 0;
  box-shadow: 8px 8px 0 0 var(--shadow-c);
  transition: background 0.3s;
}
.modal h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.1rem; color: var(--ink); text-transform: uppercase; letter-spacing: -0.01em; text-transform: none; }
.modal p { font-size: 0.8rem; color: var(--ink2); line-height: 1.75; margin-bottom: 0.85rem; font-weight: 400; }
.modal-close {
  position: absolute; top: 1rem; right: 1.2rem;
  background: var(--canvas2); border: 2px solid var(--line);
  font-family: var(--mono); font-size: 0.66rem; font-weight: 700; color: var(--ink);
  cursor: pointer; letter-spacing: 0.1em; padding: 0.18rem 0.5rem;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.12s;
}
.modal-close:hover { color: var(--red); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }

/* ── SUPPORT MODAL ── */
.support-modal { max-width: 400px; }
.support-sub { font-size: 0.78rem; color: var(--ink2); margin-bottom: 1.3rem; line-height: 1.65; }
.amount-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.9rem; }
.amount-option {
  font-family: var(--mono); font-size: 0.76rem; font-weight: 700; color: var(--ink2);
  background: var(--canvas2); border: 2px solid var(--line); border-radius: 0;
  padding: 0.55rem 0.3rem; cursor: pointer;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.15s, background 0.15s;
}
.amount-option:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }
.amount-option.active { background: var(--red); border-color: var(--line); color: #fff; }
.custom-amount-row {
  display: flex; align-items: center; border: 2px solid var(--line); border-radius: 0;
  padding: 0 0.2rem 0 0.8rem; margin-bottom: 1.3rem; background: var(--canvas);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: border-color 0.15s;
}
.custom-amount-row:has(input:focus) { border-color: var(--red); }
.custom-amount-prefix { font-family: var(--mono); color: var(--muted); font-size: 0.83rem; font-weight: 700; }
.custom-amount-row input {
  flex: 1; width: 100%; border: none; background: transparent; padding: 0.62rem 0.55rem;
  font-family: var(--mono); font-size: 0.83rem; color: var(--ink); outline: none;
}
.qr-wrap { display: flex; justify-content: center; align-items: center; padding: 1rem; background: var(--canvas2); border: 2px solid var(--line); box-shadow: 3px 3px 0 0 var(--shadow-c); border-radius: 0; margin-bottom: 1.1rem; min-height: 190px; }
.qr-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7rem; width: 190px; height: 190px; }
.qr-spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--rule); border-top-color: var(--red); animation: qr-spin 0.8s linear infinite; }
.qr-loading-text { font-family: var(--mono); font-size: 0.64rem; color: var(--muted); letter-spacing: 0.05em; font-weight: 700; }
@keyframes qr-spin { to { transform: rotate(360deg); } }
.upi-id-line-wrap { text-align: center; margin-bottom: 0.9rem; }
.upi-id-line {
  font-family: var(--mono); font-size: 0.7rem; color: var(--ink2); font-weight: 700;
  letter-spacing: 0.03em; cursor: pointer; padding: 0.25rem;
  border-bottom: 2px dashed var(--rule); display: inline-block;
  transition: color 0.15s, border-color 0.15s;
}
.upi-id-line:hover { color: var(--ink); border-color: var(--red); }
.upi-id-line.copied { color: var(--red); border-color: var(--red); }
.support-back { display: block; margin: 0 auto; background: none; border: none; font-family: var(--mono); font-size: 0.66rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; cursor: pointer; padding: 0.35rem; }
.support-back:hover { color: var(--red); }

/* ── HAMBURGER / MOBILE MENU ── */
.nav-hamburger {
  display: none; flex-direction: column; gap: 4px;
  background: none; border: 2px solid var(--line); cursor: pointer; padding: 5px;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
}
.nav-hamburger span { display: block; width: 16px; height: 2px; background: var(--ink); transition: background 0.15s; }
.nav-hamburger:hover span { background: var(--red); }

.nav-mobile-menu {
  display: none; position: fixed; top: 56px; left: 0; right: 0;
  background: var(--canvas); border-bottom: 2px solid var(--line);
  z-index: 49; padding: 1rem 1.4rem;
  flex-direction: column; gap: 0.1rem;
}
.nav-mobile-menu.open { display: flex; }
.nav-mobile-menu a {
  font-family: var(--mono); font-size: 0.8rem; font-weight: 700; color: var(--ink2);
  text-decoration: none; padding: 0.55rem 0.5rem;
  border-bottom: 2px dashed var(--rule);
  display: flex; align-items: center; gap: 0.5rem;
  text-transform: uppercase; letter-spacing: 0.03em;
}
.nav-mobile-menu a:last-child { border-bottom: none; }
.nav-mobile-menu a:hover { color: var(--red); }

/* ── RESPONSIVE BASE ── */
@media (max-width: 900px) {
  nav { padding: 0 1.5rem; }
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .nav-right { gap: 0.4rem; }
}
@media (max-width: 768px) {
  nav { padding: 0 1.2rem; }
  .support-fab { top: 66px; right: 12px; padding: 0.48rem 0.8rem; font-size: 0.62rem; }
  .footer-inner { flex-direction: column; padding: 1.4rem 1.2rem; }
  .footer-links { align-items: flex-start; }
  .footer-bottom { padding: 1rem 1.2rem 1.4rem; flex-direction: column; gap: 1rem; }
  .footer-bottom-logo { height: 44px; }
  .footer-top { margin-left: 0; }
  .amount-grid { grid-template-columns: repeat(2, 1fr); }
  .modal { padding: 1.5rem; }
}
/* ── WDM SHELL ── */
body { padding: 2rem 1.2rem 3rem; }
.shell { max-width: 1080px; margin: 0 auto; }

.hd {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  margin-bottom: 1.6rem;
}
.hd-left { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.wordmark {
  font-family: var(--mono); font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--red);
  border: 2px solid var(--line); background: var(--card);
  padding: 0.3rem 0.7rem;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
}
.title {
  font-family: var(--sans); font-size: clamp(1.4rem, 3.4vw, 2rem);
  font-weight: 700; color: var(--ink); line-height: 1.05;
  letter-spacing: -0.005em; text-transform: uppercase;
}
.subtitle { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: lowercase; }
.hd-right { display: flex; gap: 0.6rem; }

/* ── PANELS ── */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
.panel {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 0;
  box-shadow: 4px 4px 0 0 var(--shadow-c);
  padding: 1.2rem 1.3rem 1.4rem;
  margin-bottom: 1.2rem;
}
.panel-title {
  font-family: var(--mono); font-size: 0.58rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: 1rem;
}
.panel-title::after { content: ''; flex: 1; height: 2px; background: var(--line); }
.empty-hint {
  font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
  padding: 0.5rem 0 1rem; border-bottom: 2px dashed var(--rule);
}
.result-empty { font-family: var(--mono); font-size: 0.9rem; color: var(--muted); padding: 1rem 0; }

/* ── ITEMS / WEIGHTS ── */
.item {
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  padding: 0.6rem 0.2rem;
  border-bottom: 2px dashed var(--rule);
}
.item-name { font-size: 0.84rem; font-weight: 500; color: var(--ink); }
.item-del {
  background: var(--card); border: 2px solid var(--line); border-radius: 0;
  width: 24px; height: 24px; line-height: 1; flex-shrink: 0;
  cursor: pointer; color: var(--ink2); font-size: 0.9rem; font-weight: 700;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: background 0.12s, color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.item-del:hover { background: var(--red); color: #fff; transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }
.weight-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.35rem 0.2rem 0.7rem; }
.weight-row input[type="range"] { flex: 1; accent-color: var(--red); cursor: pointer; }
.w-val {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 700; color: var(--ink);
  min-width: 20px; text-align: right;
}

/* ── ADD ROW ── */
.add-row { display: flex; gap: 0.6rem; margin-top: 1rem; }
.add-row input {
  flex: 1; min-width: 0;
  background: var(--canvas); border: 2px solid var(--line); border-radius: 0;
  padding: 0.55rem 0.8rem;
  font-family: var(--sans); font-size: 0.8rem; color: var(--ink); outline: none;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: border-color 0.15s;
}
.add-row input::placeholder { color: var(--muted); }
.add-row input:focus { border-color: var(--red); }

/* ── TABLE ── */
.table-scroll { overflow-x: auto; }
.table-scroll table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.table-scroll th, .table-scroll td {
  border: 2px solid var(--line);
  padding: 0.55rem 0.7rem;
  text-align: left; white-space: nowrap;
  background: var(--card);
}
.table-scroll th {
  font-family: var(--mono); font-size: 0.56rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink);
  background: var(--canvas2);
}
.table-scroll td:first-child, .table-scroll th:first-child { font-weight: 500; color: var(--ink); }

/* ── STEPPER ── */
.stepper { display: inline-flex; align-items: center; gap: 0.4rem; }
.stepper button {
  width: 26px; height: 26px; line-height: 1;
  background: var(--card); border: 2px solid var(--line); border-radius: 0;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  cursor: pointer; font-size: 0.9rem; color: var(--ink); font-weight: 700;
  transition: background 0.12s, color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.stepper button:hover { background: var(--red); color: #fff; transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }
.stepper button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 0 var(--shadow-c); }
.stepper span {
  font-family: var(--mono); font-size: 0.78rem; font-weight: 700; color: var(--ink);
  min-width: 22px; text-align: center;
}

/* ── RESULTS ── */
.result-row {
  display: grid;
  grid-template-columns: 28px 1fr minmax(120px, 240px) auto auto;
  align-items: center; gap: 0.9rem;
  padding: 0.6rem 0.1rem;
  border-bottom: 2px dashed var(--rule);
}
.r-rank { font-family: var(--mono); font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.r-rank.top { color: var(--red); }
.r-name { font-size: 0.84rem; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-bar { height: 14px; background: var(--canvas2); border: 2px solid var(--line); border-radius: 0; box-shadow: 1px 1px 0 0 var(--shadow-c); }
.r-fill {
  height: 100%; width: 0;
  background: var(--red);
  transition: width 0.35s cubic-bezier(.22,.61,.36,1);
}
.result-row:first-child .r-fill { background: var(--green); }
.r-badge {
  font-family: var(--mono); font-size: 0.5rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--green); color: #fff;
  border: 2px solid var(--line); border-radius: 0;
  padding: 0.18rem 0.5rem; white-space: nowrap;
}
.r-score { font-family: var(--mono); font-size: 0.78rem; font-weight: 700; color: var(--muted); text-align: right; }
.r-score.top { color: var(--red); }

/* ── RESPONSIVE WDM ── */
@media (max-width: 760px) {
  .two { grid-template-columns: 1fr; }
  .result-row { grid-template-columns: 24px 1fr auto; }
  .r-bar { grid-column: 2 / 4; grid-row: 2; min-width: 0; }
  .r-badge { grid-column: 1 / 2; grid-row: 2; justify-self: start; margin-top: 0.2rem; }
}</style>

<body>
<div class="sky-fx" aria-hidden="true"></div>

  <div class="shell">

    <div class="hd">
      <div class="hd-left">
        <div class="wordmark">Tool</div>
        <div class="title">Decision Matrix</div>
        <div class="subtitle">weight · score · decide</div>
      </div>
      <div class="hd-right">
        <button class="btn-ghost" onclick="reset()">Reset</button>
        <button class="btn-ghost" onclick="toggleTheme()">Theme</button>
      </div>
    </div>

    <div class="two">
      <div class="panel">
        <div class="panel-title">Criteria</div>
        <div id="crit-list">
          <p class="empty-hint">No criteria yet.</p>
        </div>
        <div class="add-row">
          <input id="crit-in" placeholder="e.g. Cost, Speed, Quality" onkeydown="if(event.key==='Enter')addCrit()" />
          <button class="btn-add" onclick="addCrit()">+ Add</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Options</div>
        <div id="opt-list">
          <p class="empty-hint">No options yet.</p>
        </div>
        <div class="add-row">
          <input id="opt-in" placeholder="e.g. Option A, Vendor B" onkeydown="if(event.key==='Enter')addOpt()" />
          <button class="btn-add" onclick="addOpt()">+ Add</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-title">Score Matrix <span
          style="font-size:10px;font-weight:400;opacity:.5;letter-spacing:.05em;text-transform:none">— 0 to 10 per
          cell</span></div>
      <div class="table-scroll">
        <div id="table-wrap">
          <p class="empty-hint">Add criteria and options above to populate the matrix.</p>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Results</div>
      <div id="results">
        <p class="result-empty">—</p>
      </div>
    </div>

  </div>

  <script>
    let crits = [], opts = [], scores = {};

    (function () {
      const t = localStorage.getItem('dm-theme');
      if (t) document.documentElement.dataset.theme = t;
    })();

    function uid() { return Math.random().toString(36).slice(2, 8) }
    function sk(o, c) { return o + '|' + c }
    function gs(o, c) { return scores[sk(o, c)] ?? 5 }
    function ss(o, c, v) { scores[sk(o, c)] = Math.min(10, Math.max(0, v)); renderResults() }

    function toggleTheme() {
      const cur = document.documentElement.dataset.theme;
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('dm-theme', next);
    }

    function reset() {
      if (!confirm('Reset everything?')) return;
      crits = []; opts = []; scores = {}; render();
    }

    function addCrit() {
      const el = document.getElementById('crit-in');
      const v = el.value.trim(); if (!v) return;
      crits.push({ id: uid(), name: v, weight: 5 });
      el.value = ''; render();
    }

    function addOpt() {
      const el = document.getElementById('opt-in');
      const v = el.value.trim(); if (!v) return;
      opts.push({ id: uid(), name: v });
      el.value = ''; render();
    }

    function delCrit(id) { crits = crits.filter(c => c.id !== id); render() }
    function delOpt(id) { opts = opts.filter(o => o.id !== id); render() }

    function setWeight(id, v) {
      const c = crits.find(c => c.id === id);
      if (c) { c.weight = +v; document.getElementById('wv-' + id).textContent = v; }
      renderResults();
    }

    function step(oid, cid, delta) {
      const cur = gs(oid, cid);
      const next = Math.min(10, Math.max(0, cur + delta));
      ss(oid, cid, next);
      document.getElementById('sv-' + oid + '-' + cid).textContent = next;
    }

    function calculate() {
      const tw = crits.reduce((s, c) => s + c.weight, 0) || 1;
      return opts.map(o => {
        const raw = crits.reduce((s, c) => s + gs(o.id, c.id) * (c.weight / tw), 0);
        return { id: o.id, name: o.name, score: +raw.toFixed(2) };
      }).sort((a, b) => b.score - a.score);
    }

    function render() { renderCrits(); renderOpts(); renderTable(); renderResults() }

    function renderCrits() {
      const el = document.getElementById('crit-list');
      if (!crits.length) { el.innerHTML = '<p class="empty-hint">No criteria yet.</p>'; return }
      el.innerHTML = crits.map(c => `
    <div class="item">
      <span class="item-name">${esc(c.name)}</span>
      <button class="item-del" onclick="delCrit('${c.id}')">×</button>
    </div>
    <div class="weight-row">
      <input type="range" min="1" max="10" step="1" value="${c.weight}"
        oninput="setWeight('${c.id}',this.value)"/>
      <span class="w-val" id="wv-${c.id}">${c.weight}</span>
    </div>
  `).join('');
    }

    function renderOpts() {
      const el = document.getElementById('opt-list');
      if (!opts.length) { el.innerHTML = '<p class="empty-hint">No options yet.</p>'; return }
      el.innerHTML = opts.map(o => `
    <div class="item">
      <span class="item-name">${esc(o.name)}</span>
      <button class="item-del" onclick="delOpt('${o.id}')">×</button>
    </div>
  `).join('');
    }

    function renderTable() {
      const el = document.getElementById('table-wrap');
      if (!crits.length || !opts.length) {
        el.innerHTML = '<p class="empty-hint">Add criteria and options above to populate the matrix.</p>';
        return;
      }
      el.innerHTML = `<table>
    <thead><tr>
      <th>Option</th>
      ${crits.map(c => `<th>${esc(c.name)}</th>`).join('')}
    </tr></thead>
    <tbody>
    ${opts.map(o => `<tr>
      <td>${esc(o.name)}</td>
      ${crits.map(c => `<td>
        <div class="stepper">
          <button onclick="step('${o.id}','${c.id}',-1)">−</button>
          <span id="sv-${o.id}-${c.id}">${gs(o.id, c.id)}</span>
          <button onclick="step('${o.id}','${c.id}',1)">+</button>
        </div>
      </td>`).join('')}
    </tr>`).join('')}
    </tbody>
  </table>`;
    }

    function renderResults() {
      const el = document.getElementById('results');
      if (!opts.length || !crits.length) { el.innerHTML = '<p class="result-empty">—</p>'; return }
      const data = calculate();
      const max = data[0]?.score || 1;
      el.innerHTML = data.map((r, i) => `
    <div class="result-row">
      <span class="r-rank${i === 0 ? ' top' : ''}">${i + 1}</span>
      <span class="r-name">${esc(r.name)}</span>
      <div class="r-bar"><div class="r-fill" style="width:${(r.score / 10) * 100}%"></div></div>
      ${i === 0 ? '<span class="r-badge">winner</span>' : ''}
      <span class="r-score${i === 0 ? ' top' : ''}">${r.score.toFixed(1)}</span>
    </div>
  `).join('');
      requestAnimationFrame(() => {
        document.querySelectorAll('.r-fill').forEach((b, i) => {
          b.style.width = (data[i].score / 10) * 100 + '%';
        });
      });
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>

</html>
