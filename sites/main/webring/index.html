<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Network of my fellow developers :3">
<title>Webring</title>
<link rel="icon" type="image/jpeg" href="https://cdn.emtypyie.in/assets/favicon.jpg">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root, [data-theme="light"] {
  --canvas: #F9FAFB;
  --canvas2: #F3F4F6;
  --canvas3: #EEF2FF;
  --card: #FFFFFF;
  --ink: #111827;
  --ink2: #374151;
  --muted: #6B7280;
  --line: #000000;
  --rule: #C7CDD4;
  --red: #DC2626;
  --red2: #EF4444;
  --amber: #D97706;
  --green: #059669;
  --green2: #10B981;
  --blue: #2563EB;
  --shadow-c: #000000;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'Segoe UI Mono', Consolas, 'Liberation Mono', Menlo, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

[data-theme="dark"] {
  --canvas: #0E1420;
  --canvas2: #161E2C;
  --canvas3: #1D2736;
  --card: #121A26;
  --ink: #EDF2F9;
  --ink2: #C3CFDF;
  --muted: #8398AF;
  --line: #93A5BA;
  --rule: #2E3B4F;
  --red: #FF5252;
  --red2: #FF7A70;
  --amber: #FBBF24;
  --green: #22C88A;
  --green2: #34D399;
  --blue: #60A5FA;
  --shadow-c: #EDF2F9;
}

html { background: var(--canvas); transition: background-color 0.3s ease; }
body {
  background: transparent;
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: color 0.3s ease;
}
html { scrollbar-width: thin; scrollbar-color: var(--ink) var(--canvas2); }
*::-webkit-scrollbar { width: 9px; }
*::-webkit-scrollbar-track { background: var(--canvas2); }
*::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 0; }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--canvas);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 56px;
  border-bottom: 2px solid var(--line);
  transition: background 0.3s ease, border-color 0.3s ease;
}
.nav-brand {
  font-family: var(--mono); font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 700;
  color: var(--ink); text-decoration: none; letter-spacing: 0.06em;
  text-transform: uppercase; flex-shrink: 0;
  transition: color 0.15s;
}
.nav-brand:hover { color: var(--red); }
.nav-brand span { color: var(--red); }
.nav-right { display: flex; align-items: center; gap: 0.8rem; }
.nav-home {
  font-family: var(--mono); font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); text-decoration: none;
  border: 2px solid var(--line); padding: 0.38rem 0.75rem;
  background: var(--card);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, color 0.15s;
}
.nav-home:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: var(--red); }

/* ── THEME TOGGLE ── */
.theme-toggle {
  position: relative; width: 52px; height: 26px;
  background: var(--card); border: 2px solid var(--line);
  cursor: pointer; flex-shrink: 0; overflow: hidden;
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: background 0.3s, border-color 0.3s;
}
.theme-toggle:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.theme-toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--red);
  border: 2px solid var(--line);
  transition: transform 0.3s cubic-bezier(.65,0,.35,1);
}
[data-theme="dark"] .theme-toggle-thumb { transform: translateX(25px); }
.theme-toggle .icon-sun, .theme-toggle .icon-moon {
  position: absolute; top: 50%; transform: translateY(-50%);
  transition: opacity 0.25s;
}
.theme-toggle .icon-sun { left: 6px; }
.theme-toggle .icon-moon { right: 6px; }
[data-theme="light"] .icon-moon { opacity: 0.35; }
[data-theme="dark"] .icon-sun { opacity: 0.35; }

/* ── MAIN ── */
main { flex: 1; padding: 2.6rem 2rem 3rem; }
.wrap { max-width: 1200px; margin: 0 auto; }

/* ── PAGE HEAD ── */
.eyebrow {
  display: flex; align-items: center; gap: 0.7rem;
  font-family: var(--mono); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  margin-bottom: 0.9rem;
}
.eyebrow::before { content: ''; display: block; width: 26px; height: 3px; background: var(--red); flex-shrink: 0; }
.page-title {
  font-size: clamp(1.6rem, 4.5vw, 2.3rem);
  font-weight: 800; color: var(--ink); line-height: 1.05;
  text-transform: uppercase; letter-spacing: -0.01em;
}
.page-title .dot { color: var(--red); }
.page-sub {
  margin-top: 0.6rem; font-size: 0.84rem; color: var(--muted);
  font-weight: 400; line-height: 1.6; max-width: 560px;
}

/* ── RING SUMMARY ── */
.summary {
  display: flex; align-items: center; gap: 1.2rem;
  border: 2px solid var(--line);
  box-shadow: 6px 6px 0 0 var(--shadow-c);
  background: var(--card);
  padding: 1.3rem 1.6rem;
  margin: 2rem 0 2.4rem;
  flex-wrap: wrap;
  transition: background 0.3s;
}
.summary-glyph {
  width: 40px; height: 40px; flex: none;
  border: 2px solid var(--line); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--red); color: #fff;
}
.summary-glyph svg { stroke: #fff; }
.summary-main { flex: 1 1 auto; min-width: 0; }
.summary-title {
  font-family: var(--sans); font-weight: 800;
  font-size: clamp(1rem, 2.6vw, 1.3rem);
  text-transform: uppercase; letter-spacing: -0.005em;
  line-height: 1.15; margin-bottom: 0.25rem;
}
.summary-sub {
  font-family: var(--mono); font-size: 0.66rem; color: var(--muted);
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
}
.summary-count {
  font-family: var(--mono); font-size: 0.7rem; font-weight: 700;
  color: var(--ink2); letter-spacing: 0.04em;
  border: 2px solid var(--line); padding: 0.3rem 0.7rem;
  background: var(--canvas2); box-shadow: 2px 2px 0 0 var(--shadow-c);
  white-space: nowrap;
}

/* ── MEMBER GRID ── */
.section-label {
  display: flex; align-items: center; gap: 1rem;
  font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--ink); font-weight: 700;
  margin: 0 0 1.1rem;
}
.section-label::after { content: ''; flex: 1; height: 2px; background: var(--line); }
.section-label .count { color: var(--muted); }

.ring-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.4rem;
}

.ring-card {
  position: relative;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 0;
  box-shadow: 4px 4px 0 0 var(--shadow-c);
  transition: background 0.3s, transform 0.15s, box-shadow 0.15s;
  display: flex; flex-direction: column;
}
.ring-card:hover { transform: translate(-3px,-3px); box-shadow: 7px 7px 0 0 var(--shadow-c); }
.ring-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--blue); z-index: 1;
}
.ring-card.self::before { background: var(--red); }

.ring-card-head {
  display: flex; align-items: center; gap: 1rem;
  padding: 1.3rem 1.3rem 0.9rem;
}
.ring-avatar {
  width: 58px; height: 58px; flex: none;
  border: 2px solid var(--line);
  background: var(--canvas2);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  overflow: hidden;
  position: relative;
}
.ring-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ring-avatar-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 1.3rem; font-weight: 700;
  color: var(--red); background: var(--canvas2);
}
.ring-name-block { min-width: 0; }
.ring-handle {
  display: block;
  font-family: var(--mono); font-weight: 800; font-size: 1rem;
  color: var(--ink); letter-spacing: 0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color 0.15s;
}
.ring-card:hover .ring-handle { color: var(--red); }
.ring-name {
  display: block;
  font-size: 0.72rem; color: var(--muted); font-weight: 400;
  margin-top: 0.12rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ring-self-tag {
  font-family: var(--mono); font-size: 0.5rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: #fff;
  background: var(--red); border: 2px solid var(--line);
  padding: 0.12rem 0.4rem; margin-left: 0.4rem;
  vertical-align: middle;
}

.ring-role {
  font-size: 0.76rem; color: var(--ink2); line-height: 1.55;
  font-weight: 400;
  padding: 0 1.3rem 1rem;
  flex: 1;
}

.ring-links {
  display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem;
  padding: 0.85rem 1.2rem 1.1rem;
  border-top: 2px dashed var(--rule);
  margin-top: auto;
}
.ring-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--mono); font-size: 0.58rem; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink); text-decoration: none;
  border: 2px solid var(--line); padding: 0.24rem 0.6rem;
  background: var(--canvas2);
  box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.12s, background 0.12s;
}
.ring-link:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: #fff; }
.ring-link.gh:hover { background: var(--ink); }
.ring-link.web:hover { background: var(--blue); }
.ring-link.tw:hover { background: var(--green2); }

.ring-empty {
  grid-column: 1 / -1; padding: 2.5rem 0; text-align: center;
  font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
  letter-spacing: 0.1em; font-weight: 700;
}
.ring-empty span { display: block; margin-top: 0.45rem; font-size: 0.6rem; opacity: 0.6; }

/* ── FOOTER ── */
footer {
  border-top: 2px solid var(--line); background: var(--canvas);
  transition: background 0.3s;
}
.footer-inner {
  max-width: 1200px; margin: 0 auto; padding: 1.4rem 2rem;
  display: flex; justify-content: space-between; align-items: center; gap: 1.5rem;
  flex-wrap: wrap;
}
.footer-brand {
  font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
  color: var(--ink); text-transform: uppercase; letter-spacing: 0.04em;
}
.footer-brand span { color: var(--red); }
.footer-note { font-size: 0.62rem; color: var(--muted); font-weight: 400; margin-top: 0.2rem; }
.footer-top {
  font-family: var(--mono); font-size: 0.58rem; color: var(--ink); font-weight: 700;
  text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase;
  border: 2px solid var(--line); padding: 0.25rem 0.65rem;
  background: var(--card); box-shadow: 2px 2px 0 0 var(--shadow-c);
  transition: transform 0.12s, box-shadow 0.12s, color 0.12s;
  white-space: nowrap;
}
.footer-top:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--shadow-c); color: var(--red); }

/* ── RESPONSIVE ── */
@media (max-width: 960px) {
  .ring-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  main { padding: 2rem 1.2rem 2.4rem; }
  nav { padding: 0 1.2rem; }
  .ring-grid { grid-template-columns: 1fr; }
  .footer-inner { padding: 1.2rem; }
}

<script>
/* ── THEME ── */
const rootEl = document.documentElement;
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(theme) {
  rootEl.setAttribute('data-theme', theme);
  localStorage.setItem('emty-theme', theme);
}
applyTheme(localStorage.getItem('emty-theme') || 'light');
themeBtn.addEventListener('click', () => {
  const next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});

/* ── ICONS (inline, avoid template-string escaping pain) ── */
const GH_ICON = '<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 10.9c-2.4.7-2.4-1.3-3.3-1.6M10.1 12.9v-2.4a2 2 0 0 0-.5-1.5c1.9-.2 3.8-.9 3.8-4.2a3.3 3.3 0 0 0-.9-2.3 3 3 0 0 0-.1-2.2s-.7-.2-2.4.9a8.3 8.3 0 0 0-4.4 0C3.9-.2 3.2 0 3.2 0a3 3 0 0 0-.1 2.2 3.3 3.3 0 0 0-.9 2.3c0 3.3 1.9 4 3.8 4.2a2 2 0 0 0-.5 1.5v2.4"/></svg>';
const WEB_ICON = '<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><path d="M1.5 5.5h11M1.5 8.5h11"/><path d="M7 1.5c1.7 1.6 1.7 9.4 0 11M7 1.5c-1.7 1.6-1.7 9.4 0 11"/></svg>';
const TW_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

/* ── RENDER RING ── */
async function loadRing() {
  const grid = document.getElementById('ring-grid');
  const countEl = document.getElementById('member-count');
  const rosterEl = document.getElementById('roster-count');

  let members;
  try {
    const r = await fetch('/webring/members.json');
    if (!r.ok) throw new Error();
    members = (await r.json()).members || [];
  } catch {
    grid.innerHTML = '<p class="ring-empty">ring unavailable<span>could not fetch /webring/members.json</span></p>';
    return;
  }
  if (!members.length) {
    grid.innerHTML = '<p class="ring-empty">ring empty<span>no members yet</span></p>';
    return;
  }

  countEl.textContent = 'members: ' + members.length;
  rosterEl.textContent = '(' + members.length + ')';

  grid.innerHTML = members.map(m => {
    const fallback = '<span class="ring-avatar-fallback" style="display:none;">' + (m.handle || '?').charAt(0).toUpperCase() + '</span>';
    const links = [];
    if (m.site) links.push('<a class="ring-link web" href="' + m.site + '" target="_blank" rel="noopener">' + WEB_ICON + ' site</a>');
    if (m.github) links.push('<a class="ring-link gh" href="' + m.github + '" target="_blank" rel="noopener">' + GH_ICON + ' github</a>');
    if (m.twitter) links.push('<a class="ring-link tw" href="' + m.twitter + '" target="_blank" rel="noopener">' + TW_ICON + ' twitter</a>');

    return '<div class="ring-card' + (m.self ? ' self' : '') + '">' +
      '<div class="ring-card-head">' +
        '<div class="ring-avatar">' +
          '<img src="https://github.com/' + m.handle + '.png?size=128" alt="' + m.handle + ' avatar" loading="lazy" onerror="this.remove();this.parentElement.querySelector(\'.ring-avatar-fallback\').style.display=\'flex\';">' +
          fallback +
        '</div>' +
        '<div class="ring-name-block">' +
          '<span class="ring-handle">@' + m.handle + (m.self ? '<span class="ring-self-tag" title="this is me">me</span>' : '') + '</span>' +
          '<span class="ring-name">' + (m.name || '') + '</span>' +
        '</div>' +
      '</div>' +
      '<p class="ring-role">' + (m.role || '') + '</p>' +
      '<div class="ring-links">' + (links.length ? links.join('') : '<span class="ring-link" style="background:transparent;box-shadow:none;color:var(--muted);cursor:default;">no links</span>') + '</div>' +
    '</div>';
  }).join('');
}
loadRing();
</script>
