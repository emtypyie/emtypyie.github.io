name: status

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check services
        run: bash sites/main/status/check.sh
      - name: Commit status.json
        run: |
          if git diff --quiet -- sites/main/status/status.json; then
            echo "no change to status.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sites/main/status/status.json
            git commit -m "status: update service health"
            git push
          fi