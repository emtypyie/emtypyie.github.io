<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | emtypyie.in</title>
    <link rel="icon" type="image/jpeg" href="https://cdn.emtypyie.in/assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --purple: #c298ea;
            --accent: #bd5e59;
            --card: #000000;
            --tile: #2b2b2b;
            --tile-hover: #363636;
            --line: #262626;
            --text: #ffffff;
            --body: #d4d4d4;
            --muted: #a0a0a0;
            --nav-glass: rgba(14, 12, 18, 0.50);
            --nav-border: rgba(255, 255, 255, 0.14);
            --nav-menu-bg: rgba(14, 12, 18, 0.95);
            --nav-h: 4rem;
        }
        :root[data-theme="light"] {
            --purple: #c298ea;
            --accent: #0a0110;
            --card: #ffffff;
            --tile: #f3eef8;
            --tile-hover: #e8dff2;
            --line: #e7e2ee;
            --text: #17141c;
            --body: #423f47;
            --muted: #79747f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: clamp(0.9375rem, 0.4vw + 0.6rem, 1.35rem); }
        @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

        body {
            background-color: var(--purple);
            background-image: radial-gradient(rgba(0, 0, 0, 0.16) 1.6px, transparent 1.6px);
            background-size: 26px 26px;
            min-height: 100vh;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            transition: background-color 0.25s ease;
        }

        .error-card {
            text-align: center;
            max-width: 28rem;
            width: 100%;
            background-color: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 3rem 2rem;
            transition: background-color 0.25s ease;
        }

        .error-code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.75rem;
        }

        .error-path {
            display: inline-block;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.8rem;
            color: var(--muted);
            background-color: var(--tile);
            border: 1px solid var(--line);
            border-radius: 0.35rem;
            padding: 0.5rem 1rem;
            margin-bottom: 1.5rem;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .error-desc {
            font-size: 0.95rem;
            color: var(--body);
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 36ch;
            margin-left: auto;
            margin-right: auto;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .error-actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            background-color: var(--tile);
            border: 1px solid var(--line);
            padding: 0.65rem 1.2rem;
            border-radius: 0.35rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .error-actions a:hover {
            background-color: var(--tile-hover);
            border-color: var(--accent);
        }

        .error-actions a i { font-size: 0.85rem; }

        .error-footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 640px) {
            .error-card { padding: 2rem 1.25rem; }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-title">Page not found</div>
        <div class="error-path" id="error-path"></div>
        <p class="error-desc">
            The page you're looking for doesn't exist, has been moved, or is still under construction.
        </p>
        <div class="error-actions">
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            <a href="https://wiki.emtypyie.in"><i class="fa-solid fa-book-open"></i> Wiki</a>
            <a href="https://emtypyie.in/status"><i class="fa-solid fa-signal"></i> Status</a>
            <a href="mailto:me@emtypyie.in"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>

        <div class="error-footer">
            All Rights Reserved, Emtypyie.in<br>
            Maintained by Emtypyie&amp;Co
        </div>
    </div>

    <script>
        document.getElementById('error-path').textContent = window.location.pathname;

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }
        let savedTheme = 'dark';
        try { savedTheme = localStorage.getItem('emtypyie-theme') || 'dark'; } catch (e) {}
        applyTheme(savedTheme);
    </script>
</body>
</html>
