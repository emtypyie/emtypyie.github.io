<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues — emtypyie.in</title>
<style>
  :root{
    --bg:#f5f5f2;
    --ink:#111;
    --line:#d8d8d2;
    --accent:#d8ff3e;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  header{
    height:72px;
    border-bottom:2px solid var(--ink);
  }

  .wrap{
    max-width:1180px;
    margin:auto;
    padding:0 24px;
  }

  .nav{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    color:var(--ink);
    text-decoration:none;
    font-size:23px;
    font-weight:900;
    letter-spacing:-.06em;
  }

  .brand span{
    font-weight:400;
  }

  .navlinks{
    display:flex;
    gap:24px;
    font:700 13px/1 monospace;
  }

  .navlinks a{
    color:var(--ink);
    text-decoration:none;
    opacity:.45;
  }

  .navlinks a.active,
  .navlinks a:hover{
    opacity:1;
  }

  .source{
    border:2px solid var(--ink);
    background:var(--ink);
    color:white;
    padding:9px 12px;
    text-decoration:none;
    font:800 12px/1 monospace;
  }

  main{
    min-height:calc(100vh - 114px);
    display:flex;
    align-items:center;
  }

  .content{
    width:100%;
    padding:80px 0;
  }

  .eyebrow{
    margin-bottom:20px;
    font:800 11px/1 monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    max-width:900px;
    font-size:clamp(58px,11vw,132px);
    line-height:.82;
    letter-spacing:-.085em;
    text-transform:uppercase;
  }

  .notice{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:38px;
    padding:10px 13px;
    border:2px solid var(--ink);
    background:var(--accent);
    font:900 11px/1 monospace;
  }

  .dot{
    width:8px;
    height:8px;
    background:var(--ink);
    border-radius:50%;
  }

  footer{
    border-top:2px solid var(--ink);
  }

  .footer{
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    font:700 10px/1 monospace;
    color:#666;
  }

  .footer strong{
    color:var(--ink);
  }

  @media(max-width:700px){
    .wrap{padding:0 17px}

    .navlinks{
      display:none;
    }

    main{
      min-height:calc(100vh - 114px);
    }

    .content{
      padding:60px 0;
    }

    h1{
      font-size:clamp(54px,18vw,100px);
    }

    .footer{
      min-height:54px;
      align-items:flex-start;
      justify-content:center;
      flex-direction:column;
      padding:13px 0;
      gap:7px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/">emtypyie<span>.in</span></a>

    <nav class="navlinks">
      <a href="/">HOME</a>
      <a href="/projects">PROJECTS</a>
      <a href="/issues" class="active">ISSUES</a>
      <a href="/about">ABOUT</a>
    </nav>

    <a class="source" href="https://github.com/" target="_blank" rel="noreferrer">
      SOURCE ↗
    </a>
  </div>
</header>

<main>
  <section class="wrap content">
    <div class="eyebrow">emtypyie / issues</div>

    <h1>
      Work<br>
      In Progress.
    </h1>

    <div class="notice">
      <span class="dot"></span>
      CHECK BACK SOON
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer">
    <div><strong>emtypyie.in/issues</strong> emtypyie.cli.</div>
    <div>SEP 2026</div>
  </div>
</footer>

</body>
</html>
